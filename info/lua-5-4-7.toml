language = "Lua"
display = "Lua (Lua 5.4.7)"
version = "5.4.7"
filename = "Main.lua"
object = "luac.out"
compile = """
luac -o luac.out Main.lua
"""
execution = [
  "lua",
  "luac.out",
]
install = """
cd /tmp
curl -L -R -O https://www.lua.org/ftp/lua-5.4.7.tar.gz
tar zxf lua-5.4.7.tar.gz
cd lua-5.4.7
make all test
sudo make install
"""

