language = "Gleam"
display = "Gleam (Gleam 1.12.0 (OTP 28.0.2))"
filename = "src/judge.gleam"
object = "build/dev/erlang/judge/ebin/judge.beam"
compile = """
gleam build --no-print-progress
"""
execution = [
  "gleam",
  "run",
  "--no-print-progress",
]
install = """
AC_OTP_VERSION=28.0.2
AC_GLEAM_VERSION=1.12.0

sudo apt-get update
sudo apt-get install -y libssl-dev unixodbc-dev

pushd /tmp
# Install Erlang OTP
wget -q -O erlang.tar.gz https://github.com/erlang/otp/releases/download/OTP-${AC_OTP_VERSION}/otp_src_${AC_OTP_VERSION}.tar.gz
mkdir erlang
tar -C erlang --strip-components=1 -xf erlang.tar.gz
pushd erlang
./configure --without-termcap
make -j$(nproc)
sudo make install
popd

# Install Gleam
wget -q -O gleam.tar.gz https://github.com/gleam-lang/gleam/releases/download/v${AC_GLEAM_VERSION}/gleam-v${AC_GLEAM_VERSION}-x86_64-unknown-linux-musl.tar.gz
sudo tar -C /usr/local/bin -xf gleam.tar.gz
popd

# Create Project
gleam new .

# Pin gleeunit to the newest release that still supports Gleam 1.12.0.
grep -q '^gleeunit = ">= 1.0.0 and < 2.0.0"$' gleam.toml
sed -i 's/^gleeunit = ">= 1\\.0\\.0 and < 2\\.0\\.0"/gleeunit = "1.8.0"/' gleam.toml

# Install libraries
gleam add \\
bidict@1.0.0 \\
bigdecimal@1.1.0 \\
bitsandbobs@1.1.0 \\
dijkstra@1.0.0 \\
gleam_community_maths@2.0.0 \\
gleam_deque@1.0.0 \\
gleam_regexp@1.1.1 \\
gleam_stdlib@0.63.0 \\
gleam_yielder@1.1.0 \\
gleamy_structures@1.2.0 \\
glearray@2.1.0 \\
ieee_float@1.5.0 \\
iv@1.3.2 \\
stdin@2.0.2 \\
trie_again@1.1.3 \\

# build and run
gleam build
gleam run --no-print-progress

# cleanup
rm -fr build/dev/erlang/judge
"""

