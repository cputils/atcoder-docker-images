language = "D"
display = "D (DMD 2.111.0)"
filename = "source/app.d"
object = "judge"
compile = """
dub build --skip-registry=all --nodeps --build=release-nobounds
"""
execution = ["./judge"]
install = """
sudo apt-get update
sudo apt-get install -y --no-install-recommends curl build-essential ca-certificates libxml2

D_COMPLILER=\"dmd-2.111.0\"
wget -q https://dlang.org/install.sh -O /tmp/install.sh
chmod +x /tmp/install.sh
/tmp/install.sh install ${D_COMPLILER}

sudo ln -s $(/tmp/install.sh get-path ${D_COMPLILER}) /usr/local/bin/dmd
sudo ln -s $(/tmp/install.sh get-path --dub ${D_COMPLILER}) /usr/local/bin/dub

dub init -n
dub add mir@3.2.3
dub build --build=release-nobounds
rm judge source/app.d
"""

[[license]]
name = "BSL-1.0"
url = "https://github.com/dlang/dmd/blob/master/LICENSE.txt"

[library.mir]
version = "3.2.3"

[[library.mir.license]]
name = "BSL-1.0"
url = "https://github.com/libmir/mir/blob/master/LICENSE.txt"
