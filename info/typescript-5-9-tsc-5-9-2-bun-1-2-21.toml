language = "TypeScript"
display = "TypeScript 5.9 (tsc 5.9.2 (Bun 1.2.21))"
filename = "Main.ts"
object = "Main.js"
compile = """
export PATH=\"$HOME/.bun/bin:$PATH\"

# https://bun.sh/docs/typescript#suggested-compileroptions を参考
bun x --bun tsc Main.ts --lib ESNext --target ESNext --module ESNext --moduleDetection force --moduleResolution bundler --verbatimModuleSyntax --noEmitOnError --skipLibCheck --pretty | ansifilter 1>&2
"""
execution = [
  "bun",
  "Main.ts",
  "--no-install",
]
install = """
curl -fsSL https://bun.sh/install | bash -s \"bun-v1.2.21\"

export PATH=\"$HOME/.bun/bin:$PATH\"

# 型系統(TSのみ)
bun add --no-cache @types/bun@1.2.21 @types/lodash@4.17.20 @types/node@22.18.1 typescript@5.9.2

bun add --no-cache ac-library-js@0.1.1 data-structure-typed@2.0.4 immutable@5.1.3 lodash@4.17.21 mathjs@14.7.0 tstl@3.0.0

sudo apt update
sudo apt install ansifilter -y --no-install-recommends
"""

[environment]
NO_COLOR = "true"
PATH = "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/home/runner/.bun/bin"

