language = "SQL"
display = "SQL (DuckDB 1.3.2)"
filename = "Main.sql"
execution = [
  "duckdb",
  "-noheader",
  "-f",
  "Main.sql",
]
install = """
ACLANGUPDATE_DUCKDB_VERSION=1.3.2

cd /tmp
wget -q https://github.com/duckdb/duckdb/releases/download/v${ACLANGUPDATE_DUCKDB_VERSION}/duckdb_cli-linux-amd64.gz
gunzip duckdb_cli-linux-amd64.gz
sudo install duckdb_cli-linux-amd64 /usr/local/bin/duckdb
"""

