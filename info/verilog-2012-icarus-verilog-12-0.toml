language = "Verilog"
display = "Verilog 2012 (Icarus Verilog 12.0)"
filename = "Main.v"
object = "a.out"
compile = """
iverilog -g2012 -DONLINE_JUDGE -DATCODER Main.v
"""
execution = [
  "vvp",
  "-n",
  "a.out",
]
install = """
sudo apt update
sudo apt install -y iverilog=12.0-2build2
"""

