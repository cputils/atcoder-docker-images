language = "なでしこ"
display = "なでしこ (cnako3 3.7.8 (Node.js 22.19.0))"
filename = "Main.nako3"
object = "Main.mjs"
compile = """
cnako3 -c Main.nako3
"""
execution = [
  "sh",
  "node.sh",
  "{memory:kb}",
  "Main.mjs",
]
install = """
NODE_VERSION=22.19.0
wget -q -O /tmp/node.tar.xz https://nodejs.org/dist/v$NODE_VERSION/node-v$NODE_VERSION-linux-x64.tar.xz
sudo tar -C /usr/local --strip-components=1 -xf /tmp/node.tar.xz --wildcards '*/bin' '*/share' '*/lib' '*/include'

# Node.js cannot find libraries in /usr/local/lib/node_modules
sudo ln -s /usr/local/lib/node_modules /node_modules

sudo npm install -g nadesiko3@3.7.8

cat << 'EOF' > node.sh
#!/bin/sh

if [ \"$1\" -gt 1048576 ]; then
  stack_size=1048576
else
  stack_size=\"$1\"
fi

filename=\"$2\"

node \\
--stack-size=\"$stack_size\" \\
\"$filename\" \\
EOF

echo '「こんにちは」と表示' > Main.nako3
cnako3 -c Main.nako3
sh node.sh 2097152 Main.mjs
rm Main.mjs Main.nako3
"""

