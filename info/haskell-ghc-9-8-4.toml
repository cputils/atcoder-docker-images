language = "Haskell"
display = "Haskell (GHC 9.8.4)"
name = "GHC"
version = "9.8.4"
filename = "submission/app/Main.hs"
object = "main"
compile = """
cd submission
source ~/.ghcup/env
cabal v2-build --offline && cp $(cabal list-bin main) ../
"""
execution = ["./main"]
install = """
sudo apt-get update
sudo apt-get upgrade -y
sudo apt-get install -y --no-install-recommends build-essential ca-certificates curl libffi-dev libffi8ubuntu1 libgmp-dev libgmp10 libncurses-dev libncurses6 libtinfo6 llvm-15

curl --proto '=https' --tlsv1.2 -sSf https://get-ghcup.haskell.org | BOOTSTRAP_HASKELL_NONINTERACTIVE=1 BOOTSTRAP_HASKELL_MINIMAL=1 sh
mkdir -p ~/.cabal
source ~/.ghcup/env
ghcup install cabal 3.14.2.0 && ghcup set cabal 3.14.2.0
ghcup install ghc 9.8.4 && ghcup set ghc 9.8.4

sudo apt-get install -y --no-install-recommends libgsl0-dev liblapack-dev libatlas-base-dev libglpk-dev

mkdir -p submission/app

cd submission

cat > submission.cabal <<'PKG_CABAL_EOF'
cabal-version:      3.4
name:               submission
version:            0.1.0.0
synopsis:           A Haskell program submitted to AtCoder
-- description:
license:            NONE
author:             submitter-anonymous
maintainer:         NONE
-- copyright:
category:           Competitive
build-type:         Simple
-- extra-doc-files:    CHANGELOG.md
-- extra-source-files:

common warnings
    ghc-options: -Wall

flag atcoder
    description:    Indicates this is on the AtCoder judge server
    default:        False
    manual:         True

executable main
    import:           warnings
    main-is:          Main.hs
    -- other-modules:
    -- other-extensions:
    build-depends:
                  Cabal ^>=3.16.0.0,
                  Cabal-syntax ^>=3.16.0.0,
                  QuickCheck ^>=2.16.0.0,
                  ac-library-hs ^>=1.5.3.0,
