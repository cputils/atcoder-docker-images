                  heaps ^>=0.4.1,
                  hmatrix ^>=0.20.2,
                  hmatrix-glpk ^>=0.19.0.0,
                  hmatrix-gsl ^>=0.19.0.1,
                  hmatrix-special ^>=0.19.0.0,
