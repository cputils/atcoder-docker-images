language = "Python"
display = "Python (PyPy 3.11-v7.3.20)"
filename = "Main.py"
object = "./__pycache__/Main.pypy311.pyc"
compile = """
pypy3 -m py_compile Main.py
pypy3 Main.py ONLINE_JUDGE 2> /dev/null
"""
execution = [
  "pypy3",
  "-X",
  "int_max_str_digits=0",
  "Main.py",
]
install = """
cd /tmp

sudo apt-get update

# インストール時の依存関係
sudo apt-get install -y git wget bzip2

# ライブラリの依存関係
sudo DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential gfortran libopenblas-dev liblapack-dev pkg-config libgeos-dev meson

# Keep pandas' isolated build environment below Meson 1.11.0.
cat >/tmp/pypy-pip-constraints.txt <<'EOF'
meson<1.11.0
EOF

# ビルド済みバイナリをインストール
wget https://downloads.python.org/pypy/pypy3.11-v7.3.20-linux64.tar.bz2
tar jxvf pypy3.11-v7.3.20-linux64.tar.bz2

cd pypy3.11-v7.3.20-linux64

# pipを有効化
./bin/pypy3 -m ensurepip
./bin/pip3 install --upgrade pip


# ライブラリをインストール
PIP_CONSTRAINT=/tmp/pypy-pip-constraints.txt ./bin/pip3 install --break-system-packages \\
    numpy==2.3.2 \\
    scipy==1.15.3 \\
    networkx==3.5 \\
    sympy==1.14.0 \\
    sortedcontainers==2.4.0 \\
    more-itertools==10.7.0 \\
    shapely==2.1.1 \\
    bitarray==3.6.0 \\
    PuLP==3.2.2 \\
    mpmath==1.3.0 \\
    pandas==2.3.1 \\
    z3-solver==4.15.1.0 \\
    scikit-learn==1.7.1 \\
    cppyy==3.5.0 \\
    acl-cpp-python==0.6.2 \\
    git+https://github.com/not522/ac-library-python@27fdbb71cd0d566bdeb12746db59c9d908c6b5d5


# パスが通る所へ移動
sudo cp -r ./bin/* /usr/local/bin
sudo cp -r ./include/* /usr/local/include
sudo cp -r ./lib/* /usr/local/lib
"""

