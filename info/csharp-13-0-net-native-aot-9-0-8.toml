[environment]
DOTNET_ROOT = "/home/runner/.dotnet"
PATH = "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/home/runner/.dotnet:/home/runner/.dotnet/tools"
DOTNET_EnableWriteXorExecute = "0"
DOTNET_CLI_TELEMETRY_OPTOUT = "1"

