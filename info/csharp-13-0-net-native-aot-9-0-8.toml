language = "C#"
display = "C# 13.0 (.NET Native AOT 9.0.8)"
filename = "Main.cs"
object = "publish/Main"
compile = """
export DOTNET_ROOT=$HOME/.dotnet
export PATH=$PATH:$DOTNET_ROOT:$DOTNET_ROOT/tools
export DOTNET_EnableWriteXorExecute=0
export DOTNET_CLI_TELEMETRY_OPTOUT=1
dotnet publish -c Release -o publish --no-restore --nologo -v q --tl:off 1>&2
"""
execution = ["./publish/Main"]
install = """
# Install .NET SDK
sudo apt-get update
sudo apt-get install -y ca-certificates clang libc6 libgcc-s1 libgssapi-krb5-2 libicu74 liblttng-ust1 libssl3 libstdc++6 libunwind8 zlib1g zlib1g-dev
wget -O - https://dot.net/v1/dotnet-install.sh | bash -s -- --version 9.0.304

# Set environment variables
export DOTNET_ROOT=$HOME/.dotnet
export PATH=$PATH:$DOTNET_ROOT:$DOTNET_ROOT/tools
export DOTNET_EnableWriteXorExecute=0
export DOTNET_CLI_TELEMETRY_OPTOUT=1

# Create a project file in the current directory
cat > Main.csproj << EOS
<Project Sdk=\"Microsoft.NET.Sdk\">
  <PropertyGroup>
    <OutputType>Exe</OutputType>
    <TargetFramework>net9.0</TargetFramework>
    <ImplicitUsings>enable</ImplicitUsings>
    <Nullable>annotations</Nullable>
    <AllowUnsafeBlocks>true</AllowUnsafeBlocks>
    <DefineConstants>ONLINE_JUDGE;ATCODER</DefineConstants>
    <RuntimeIdentifier>linux-x64</RuntimeIdentifier>
    <PublishAot>true</PublishAot>
    <OptimizationPreference>Speed</OptimizationPreference>
    <IlcInstructionSet>native</IlcInstructionSet>
    <IlcMaxVectorTBitWidth>512</IlcMaxVectorTBitWidth>
    <SatelliteResourceLanguages>en-US</SatelliteResourceLanguages>
    <InvariantGlobalization>true</InvariantGlobalization>
    <WarningsAsErrors>IL2104;IL3053</WarningsAsErrors>
    <RestorePackagesWithLockFile>true</RestorePackagesWithLockFile>
    <RestoreLockedMode>true</RestoreLockedMode>
  </PropertyGroup>
  <ItemGroup>
    <PackageReference Include=\"ac-library-csharp\" Version=\"3.9.2-atcoder1\" />
    <PackageReference Include=\"MathNet.Numerics\" Version=\"5.0.0\" />
  </ItemGroup>
</Project>
EOS

# Create a lock file in the current directory for library reproducibility
cat > packages.lock.json << EOS
